# Proton Mail Bridge for local IMAP testing. See docs/IMAP_PROTON.md.
#
# Builds Bridge from the official ProtonMail/proton-bridge source (see
# Dockerfile). shenxn/protonmail-bridge's Docker Hub images stopped at 3.19.0,
# so build locally instead of trusting a third-party prebuilt image with your
# Proton login. Bump BRIDGE_VERSION (a proton-bridge tag) to upgrade.
#
# One-time login (interactive, handles 2FA):
#   docker compose -f docker/proton-bridge/docker-compose.yml run --rm proton-bridge init
#   then in the Bridge shell: `login`, then `info` (copy the Bridge password), then `exit`.
# Run:
#   docker compose -f docker/proton-bridge/docker-compose.yml up -d
services:
  proton-bridge:
    build:
      context: .
      args:
        BRIDGE_VERSION: v3.27.1
    image: inbox-zero/proton-bridge:v3.27.1
    restart: unless-stopped
    ports:
      # Loopback only, like the desktop Bridge. SMTP is on 1026 because
      # 1025 is commonly taken by Mailpit; IMAP keeps Bridge's default 1143.
      - "127.0.0.1:1143:143/tcp"
      - "127.0.0.1:1026:25/tcp"
    volumes:
      - proton-bridge:/root

volumes:
  proton-bridge:
